name: Docs checks

# No `branches` filter on pull_request. A stacked pull request targets the
# branch of the pull request below it, not main, so a `branches: [main]` filter
# would skip every stacked change and only run on the last one in a stack.
# Main is also checked on push, so a red main shows on main itself.
on:
  pull_request:
  push:
    branches: [main]

# Read-only. This workflow runs code from the pull request branch, so it is
# `pull_request` rather than `pull_request_target` and it is given no write
# scope and no secrets.
permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Locale literals and extraction-hostile markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # On a pull request, HEAD is the merge commit and HEAD^1 the base tip.
      - name: List the files this pull request changes
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only HEAD^1 HEAD >"$RUNNER_TEMP/changed-files"
          echo "LOCALE_CHECK_CHANGED_FILES=$RUNNER_TEMP/changed-files" >>"$GITHUB_ENV"

      - name: Keep API literals untranslated
        run: sh scripts/check-locale-api-literals.sh

      - name: Check the locale literal fixtures
        run: sh scripts/check-locale-api-literals-selftest.sh

      - name: Keep published samples runnable
        run: sh scripts/check-extraction-hostile-markdown.sh
